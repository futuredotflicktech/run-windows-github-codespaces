services:
  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "${VERSION:-tiny11}"
      RAM_SIZE: "10G"
      CPU_CORES: "4"
      DISK_SIZE: "100G"
      USER: "zaz"
      PASSWORD: "123456"
    devices:
      - /dev/kvm
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"
    volumes:
      - ./win_data:/storage
    restart: always
